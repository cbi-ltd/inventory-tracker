spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
server.port=${PORT:8080}

spring.jpa.hibernate.ddl-auto=update
# spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jackson.mapper.accept-case-insensitive-enums=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

cams.request-processor.base-url=${CAMS_REQUEST_PROCESSOR}
cams.jwt.secret=${CAMS_JWT_SECRET}
cams.webhook.secret=${CAMS_WEBHOOK_SECRET}
cams.base-url=http://localhost:8081

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# CAMS webhook receiver (contract v1)
# While a secret is being rotated, put the old one here so notices signed with either are accepted.
cams.webhook.previous-secret=${CAMS_WEBHOOK_PREVIOUS_SECRET:}
cams.webhook.tolerance-seconds=300
# FuelFlow's institution id on CAMS. Notices for any other institution are ignored. Empty = not checked.
cams.institution-id=${CAMS_INSTITUTION_ID:}
# How long a pending payment stays open, and whether a terminal may have only one open payment at a time.
cams.pending.transfer-ttl-minutes=15
cams.pending.card-ttl-minutes=10
cams.pending.single-open-per-terminal=true
