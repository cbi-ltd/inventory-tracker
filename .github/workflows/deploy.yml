name: FuelFlow Backend CI/CD

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging]

permissions:
  contents: read

concurrency:
  group: ffbe-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/cbi-technologies-projects/fuelflow-backend
  TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
  TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db:1

jobs:
  build:
    name: Build (Maven, Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Build
        run: mvn -B -ntp -DskipTests clean package

  test:
    name: Tests
    runs-on: ubuntu-latest
    continue-on-error: true   # report-only until the dev confirms tests run cleanly in CI
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: fuelflow, POSTGRES_USER: fuelflow, POSTGRES_PASSWORD: test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fuelflow" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/fuelflow
      DATABASE_USERNAME: fuelflow
      DATABASE_PASSWORD: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: mvn -B -ntp test

  sca-sbom:
    name: Dependency scan + SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: '0'   # report-only to start; flip to 1 once clean
      - name: SBOM (Syft)
        uses: anchore/sbom-action@8e94d75ddd33f69f691467e42275782e4bfefe84 # v0.20.9
        with: { path: ., format: spdx-json, output-file: sbom.spdx.json }
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: sbom.spdx.json }

  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --no-banner --redact \
          || echo "::warning::gitleaks findings (non-blocking until triaged)"

  build-push:
    name: Build image, scan & push (GHCR)
    needs: [build, sca-sbom, secrets-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=staging-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: GHCR login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        run: docker build -t "$IMAGE:${{ steps.meta.outputs.tag }}" -t "$IMAGE:staging" .
      - name: Trivy image scan (gate on CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
      - name: Push
        run: |
          docker push "$IMAGE:${{ steps.meta.outputs.tag }}"
          docker push "$IMAGE:staging"

  deploy:
    name: Deploy to Huawei (self-hosted runner)
    needs: [build-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: [self-hosted, fuelflow-backend]
    environment: staging
    permissions:
      contents: read
      packages: read   # needed so the runner's GITHUB_TOKEN can pull the private GHCR image
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          CAMS_REQUEST_PROCESSOR: ${{ secrets.CAMS_REQUEST_PROCESSOR }}
          CAMS_JWT_SECRET: ${{ secrets.CAMS_JWT_SECRET }}
          CAMS_WEBHOOK_SECRET: ${{ secrets.CAMS_WEBHOOK_SECRET }}
          CAMS_WEBHOOK_PREVIOUS_SECRET: ${{ secrets.CAMS_WEBHOOK_PREVIOUS_SECRET }}
          CAMS_INSTITUTION_ID: ${{ secrets.CAMS_INSTITUTION_ID }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: |
          chmod +x deploy/deploy.sh
          deploy/deploy.sh "${{ needs.build-push.outputs.tag }}"
