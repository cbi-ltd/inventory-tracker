# FuelFlow backend — staging runtime (Huawei ECS fuelflow-backend-staging).
# Postgres runs on-box (staging choice). IMAGE + secrets come from .env, written by deploy.sh.
services:
  postgres:
    image: postgres:16-alpine
    container_name: fuelflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fuelflow
      POSTGRES_USER: fuelflow
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - fuelflow_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fuelflow -d fuelflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ${IMAGE}
    container_name: fuelflow-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/fuelflow
      DATABASE_USERNAME: fuelflow
      DATABASE_PASSWORD: ${DB_PASSWORD}
      CAMS_REQUEST_PROCESSOR: ${CAMS_REQUEST_PROCESSOR}
      CAMS_JWT_SECRET: ${CAMS_JWT_SECRET}
      CAMS_WEBHOOK_SECRET: ${CAMS_WEBHOOK_SECRET}
      CAMS_WEBHOOK_PREVIOUS_SECRET: ${CAMS_WEBHOOK_PREVIOUS_SECRET}
      CAMS_INSTITUTION_ID: ${CAMS_INSTITUTION_ID}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    ports:
      - "8080:8080"   # reached internally by cac-app-svr nginx (/fuel-api) and CAMS webhooks
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  # Log viewer UI (ArgoCD-style). Localhost-only — reached via an SSH local-forward over the
  # jump host (VPN + key gated); never exposed on the network. Hardened: pinned by digest,
  # socket read-only, UI container-control + shell disabled, no extra privileges, isolated network.
  dozzle:
    image: amir20/dozzle@sha256:08cd5230e21e364241f3dcf26191f293166f7835654eb7e41168b9c685f0947b
    container_name: dozzle
    restart: unless-stopped
    environment:
      DOZZLE_NO_ANALYTICS: "true"
      DOZZLE_ENABLE_ACTIONS: "false"   # no start/stop/restart of containers from the UI
      DOZZLE_ENABLE_SHELL: "false"     # no exec-into-container from the UI
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:8888:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - ops

networks:
  # Dedicated network isolates Dozzle from app/postgres (they're on the default network).
  # NOT 'internal' — an internal network can't publish the 127.0.0.1:8888 host port.
  ops: {}

volumes:
  fuelflow_pg:
    name: fuelflow_pg
